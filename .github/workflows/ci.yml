name: CI

on:
  pull_request:
    branches: [main, dev]
  push:
    branches: [main, dev]

permissions:
  contents: read

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Lint
        run: bun run lint

  typecheck:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Typecheck
        run: bun turbo typecheck

  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Run tests (excluding long-running e2e)
        run: |
          cd packages/tinycode && bun test --timeout 30000 \
            --exclude test/cli/cmd/tui/ \
            --exclude test/server/httpapi-listen.test.ts \
            --exclude test/cli/help/

  test-packages:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Install dependencies
        run: bun install --frozen-lockfile

      # Desktop (Electron) tests are skipped — they require a display server
      - name: Test packages/app
        run: cd packages/app && bun run test

      - name: Test packages/ui
        run: cd packages/ui && bun test src

      - name: Test packages/llm
        run: cd packages/llm && bun test --timeout 30000

      - name: Test packages/effect-drizzle-sqlite
        run: cd packages/effect-drizzle-sqlite && bun test --timeout 30000

      - name: Test packages/http-recorder
        run: cd packages/http-recorder && bun test --timeout 30000
